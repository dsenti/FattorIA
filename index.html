<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#557579">
  <meta name="description" content="FattorIA: il gioco del corso FATE-AI.">
  <title>FattorIA · FATE-AI</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preload" href="assets/fonts/pixelify-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ============================================================ MAP -->
  <section id="screen-map" class="screen">
    <header class="topbar">
      <div class="title">FattorIA</div>
      <div class="coins" aria-label="Monete"><span class="coin-ic-slot"></span> <span class="coin-value">0</span></div>
    </header>
    <div class="map" id="map">
      <div class="map-scroll" id="map-scroll">
      <div class="map-frame">
        <img class="map-img" id="map-img" src="assets/map/map-day-s0l0.png" width="260" height="467" alt="La valle di FattorIA: le montagne del Matese, il villaggio, il fiume e le stazioni">
        <div class="places">
          <button class="place" id="place-weigh" style="left:25.64%;top:67.71%;width:23.59%;height:13.71%">
            <span class="place-tag"><span class="place-name">La pesatura</span></span>
          </button>
          <button class="place locked buyable" id="place-sort" style="left:75.9%;top:56.0%;width:24.62%;height:11.14%">
            <span class="place-tag"><span class="place-name">Lo smistamento</span><span class="place-lock" id="place-sort-lock"></span></span>
          </button>
          <button class="place locked buyable" id="place-lab" style="left:72.31%;top:86.29%;width:26.67%;height:8.57%">
            <span class="place-tag"><span class="place-name">Il laboratorio</span><span class="place-lock" id="place-lab-lock"></span></span>
          </button>
          <button class="place locked tag-up" id="place-barn" style="left:14.36%;top:57.14%;width:20.51%;height:7.14%" data-lesson="4" aria-disabled="true" aria-label="La stalla, si sblocca nella lezione 4">
            <span class="place-tag"><span class="place-name">La stalla</span><span class="place-lock">Lezione 4</span></span>
          </button>
        </div>
      </div>
      </div>
      <button class="btn icon map-time" id="map-time" aria-label="Giorno o notte"></button>
    </div>
    <div class="map-player" id="map-player"></div>
    <nav class="bottombar">
      <button class="btn" id="btn-shop"><span class="ic" id="ic-shop"></span>Negozio</button>
      <button class="btn" id="btn-board"><span class="ic" id="ic-board"></span>Classifica</button>
      <button class="btn icon" id="btn-settings" aria-label="Impostazioni"></button>
    </nav>
  </section>

  <!-- ============================================================ WEIGHING STATION -->
  <section id="screen-weigh" class="screen" hidden>
    <header class="topbar">
      <button class="btn icon" id="w-back" aria-label="Torna alla mappa"></button>
      <div class="title small">Pesatura</div>
      <div class="coins" aria-label="Monete"><span class="coin-ic-slot"></span> <span class="coin-value">0</span></div>
      <button class="btn icon" id="w-help" aria-label="Come si gioca"></button>
      <button class="btn icon" id="w-shop" aria-label="Negozio"></button>
    </header>
    <div class="bubble">
      <div class="bubble-face" id="w-face">👨‍🌾</div>
      <div class="bubble-body">
        <div class="bubble-who" id="w-who"></div>
        <div class="bubble-text" id="w-text"></div>
        <div class="bubble-sub" id="w-sub"></div>
      </div>
    </div>
    <div class="plot-wrap"><canvas id="w-plot"></canvas></div>
    <div class="scene-wrap"><canvas id="w-scene" aria-label="Camion, nastro e scanner. Tocca il camion per scaricare una cassetta."></canvas></div>
    <div class="info-row"><span id="w-crates"></span><span id="w-count"></span></div>
    <div class="bottom">
      <div class="controls" id="w-controls">
        <div class="drag-info" id="w-drag-info" hidden>
          <div class="drag-hint">👆 Trascina i due pallini per spostare la retta</div>
          <div class="drag-words" id="w-drag-words"></div>
        </div>
        <div class="slider-row">
          <div class="slider-label">pendenza <em>(slope)</em></div>
          <div class="slider-box">
            <svg class="slider-end" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8 L21 17" /></svg>
            <div id="w-slope"></div>
            <svg class="slider-end" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21 L18 3" /></svg>
          </div>
        </div>
        <div class="slider-row">
          <div class="slider-label">intercetta <em>(intercept)</em></div>
          <div class="slider-box">
            <svg class="slider-end" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 L12 20 M6 14 L12 20 L18 14" /></svg>
            <div id="w-intercept"></div>
            <svg class="slider-end" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20 L12 4 M6 10 L12 4 L18 10" /></svg>
          </div>
        </div>
        <div class="lock-row">
          <button class="btn primary big" id="w-lock" disabled>Blocca la retta 🔒</button>
        </div>
      </div>
      <div class="result" id="w-result" hidden>
        <div class="result-head">
          <div class="result-title" id="w-res-title"></div>
          <div class="result-coins" id="w-res-coins">+0 🪙</div>
        </div>
        <div class="result-label">Errore <em>(error)</em> medio sul raccolto intero:</div>
        <div class="bar-row"><span class="bar-name"><i class="swatch me"></i>la tua retta</span><span class="bar"><span class="bar-fill me" id="w-bar-me"></span></span></div>
        <div class="bar-row"><span class="bar-name"><i class="swatch best"></i>retta migliore <em>(line of best fit)</em></span><span class="bar"><span class="bar-fill best" id="w-bar-best"></span></span></div>
        <div class="result-note" id="w-res-note"></div>
        <button class="btn primary big" id="w-next">Prossimo agricoltore ➜</button>
      </div>
    </div>
  </section>

  <!-- ============================================================ SORTING STATION (minigame 2) -->
  <section id="screen-sort" class="screen" hidden>
    <header class="topbar">
      <button class="btn icon" id="s-back" aria-label="Torna alla mappa"></button>
      <div class="title small">Smistamento</div>
      <div class="coins" aria-label="Monete"><span class="coin-ic-slot"></span> <span class="coin-value">0</span></div>
      <button class="btn icon" id="s-help" aria-label="Come si gioca"></button>
      <button class="btn icon" id="s-shop" aria-label="Negozio"></button>
    </header>
    <div class="s-levelbar">
      <button class="btn s-levels" id="s-levels" aria-label="Livelli"><span class="s-levels-ic"></span><span id="s-level-no">1/15</span></button>
      <div class="s-level-text"><div class="s-level-title" id="s-title"></div><div class="s-story" id="s-story"></div></div>
    </div>
    <div class="s-scroll" id="s-scroll">
      <div class="s-caption" id="s-caption"></div>
      <svg id="s-svg" class="s-svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="La macchina smistatrice: tramoggia, cancelli, tubi e camion"></svg>
    </div>
    <div class="s-card" id="s-card" hidden></div>
    <div class="s-bottom">
      <div class="s-result" id="s-result"></div>
      <div class="s-actions">
        <button class="btn olive big" id="s-try">Prova l'albero</button>
        <button class="btn primary big" id="s-deliver" disabled>Avanti</button>
      </div>
    </div>
  </section>

  <!-- ============================================================ LAB (minigame 3) -->
  <section id="screen-lab" class="screen" hidden>
    <header class="topbar">
      <button class="btn icon" id="l-back" aria-label="Torna alla mappa"></button>
      <div class="title small">Laboratorio</div>
      <div class="coins" aria-label="Monete"><span class="coin-ic-slot"></span> <span class="coin-value">0</span></div>
      <button class="btn icon" id="l-help" aria-label="Come si gioca"></button>
      <button class="btn icon" id="l-shop" aria-label="Negozio"></button>
    </header>
    <div class="s-levelbar">
      <button class="btn s-levels" id="l-levels" aria-label="Livelli"><span class="l-levels-ic"></span><span id="l-level-no">1/10</span></button>
      <div class="s-level-text"><div class="s-level-title" id="l-title"></div><div class="l-legend" id="l-legend"></div></div>
      <button class="btn icon l-restart" id="l-restart" aria-label="Ricomincia il livello: albero vuoto, campioni nuovi"></button>
    </div>
    <div class="l-scroll" id="l-scroll">
      <div class="l-field-wrap" id="l-field-wrap"><canvas id="l-field" aria-label="Il campo: ogni punto è un campione, il colore è la sua etichetta"></canvas></div>
      <svg id="l-tree" class="l-tree" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Il tuo albero di decisione: tocca un nodo"></svg>
    </div>
    <div class="s-bottom">
      <div class="l-score" id="l-score"></div>
      <div class="s-actions">
        <button class="btn olive big" id="l-try" disabled>Prova</button>
        <button class="btn primary big" id="l-next" disabled>Avanti</button>
      </div>
    </div>
    <div class="l-pop" id="l-pop" hidden>
      <div class="l-card" id="l-card" role="dialog" aria-modal="true" aria-labelledby="l-pop-title">
        <div class="l-card-head">
          <b id="l-pop-title">Nodo 1</b>
          <span class="l-pop-n" id="l-pop-n"></span>
          <span class="l-pop-ok" id="l-pop-ok"></span>
          <button class="btn icon" id="l-pop-x" aria-label="Chiudi"></button>
        </div>
        <canvas id="l-pop-canvas" class="l-pop-canvas" aria-label="Trascina i due pallini della linea"></canvas>
        <div class="l-sides" id="l-sides"></div>
        <div class="l-pop-actions">
          <button class="btn l-hint" id="l-hint" aria-label="Suggerimento"></button>
          <button class="btn l-del" id="l-del" aria-label="Elimina il nodo"></button>
          <button class="btn olive l-apply" id="l-apply"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================================================ SHEETS AND MODALS -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button class="btn icon" id="sheet-close" aria-label="Chiudi">✕</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true">
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
